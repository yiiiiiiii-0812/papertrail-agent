<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f8fc" />
  <title>PaperTrail · 文献阅读 Agent</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <svg aria-hidden="true" width="0" height="0" style="position:absolute;overflow:hidden">
    <defs>
      <symbol id="ico-books" viewBox="0 0 24 24"><path d="M4 19V5a2 2 0 0 1 2-2h2v16H6a2 2 0 0 0 0 4h15V7a2 2 0 0 0-2-2h-3M9 5h7v14H9z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="ico-wand" viewBox="0 0 24 24"><path d="m4 20 14-14m-5-3 1 3 3 1-3 1-1 3-1-3-3-1 3-1zM20 13l.7 2 2 .7-2 .8-.7 2-.8-2-2-.8 2-.7z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
      <symbol id="ico-file" viewBox="0 0 24 24"><path d="M7 3h7l5 5v12a1 1 0 0 1-1 1H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm7 0v5h5M9 13h6M9 17h6" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="ico-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="13" y="3" width="8" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="3" y="13" width="8" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="13" y="13" width="8" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
      <symbol id="ico-arrow" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6" stroke="currentColor" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="ico-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6" stroke="currentColor" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="ico-check" viewBox="0 0 24 24"><path d="m5 12 5 5L20 7" stroke="currentColor" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="ico-upload" viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5M4 16v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4" stroke="currentColor" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="ico-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z" stroke="currentColor" fill="none" stroke-width="1.7"/><circle cx="12" cy="12" r="3" stroke="currentColor" fill="none" stroke-width="1.7"/></symbol>
      <symbol id="ico-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" fill="none" stroke-width="1.7"/><path d="M12 7v5l3 2" stroke="currentColor" fill="none" stroke-width="1.7" stroke-linecap="round"/></symbol>
      <symbol id="ico-trash" viewBox="0 0 24 24"><path d="M4 7h16m-12 0V4h8v3m-9 0 1 14h8l1-14M10 11v6m4-6v6" stroke="currentColor" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="ico-spark" viewBox="0 0 24 24"><path d="m12 2 2.2 7.8L22 12l-7.8 2.2L12 22l-2.2-7.8L2 12l7.8-2.2L12 2z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
      <symbol id="ico-download" viewBox="0 0 24 24"><path d="M12 3v13m-5-5 5 5 5-5M4 18v3h16v-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="ico-x" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19" stroke="currentColor" fill="none" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="ico-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 11v6m0-10v1" stroke="currentColor" fill="none" stroke-width="1.9" stroke-linecap="round"/></symbol>
    </defs>
  </svg>

  <div class="layout">
    <aside class="sidebar">
      <div class="brand"><div class="brand-icon">P<span class="brand-glow"></span></div><div><strong>PaperTrail</strong><small>文献阅读 Agent</small></div></div>
      <div class="side-section-label">WORKSPACE</div>
      <nav class="side-nav" aria-label="主导航">
        <button class="nav-link is-active" data-view="workspace"><svg class="icon"><use href="#ico-grid"/></svg> 阅读工作台 <span class="nav-count">01</span></button>
        <button class="nav-link" data-view="library"><svg class="icon"><use href="#ico-books"/></svg> 我的文献库 <span id="docCounter" class="nav-count">0</span></button>
        <button class="nav-link" data-view="cards"><svg class="icon"><use href="#ico-file"/></svg> 阅读成果卡 <span id="cardCounter" class="nav-count">0</span></button>
      </nav>
      <div class="side-bottom">
        <div class="side-illustration"><div class="orbit orbit-one"></div><div class="orbit orbit-two"></div><div class="orbit-dot dot-one"></div><div class="orbit-dot dot-two"></div><div class="orbit-center">✦</div></div>
        <div class="side-bottom-title">让每个结论<br/>都有迹可循。</div>
        <div class="side-bottom-desc">从阅读任务到原文证据，构建可复用的研究知识。</div>
        <button class="side-help" data-action="show-about"><svg class="icon"><use href="#ico-info"/></svg> 关于工作流 <span>↗</span></button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar"><div class="top-left"><span class="crumb">MY WORKSPACE</span><span class="top-slash">/</span><span id="topPageName" class="top-current">阅读工作台</span></div><div class="top-actions"><span id="modeBadge" class="mode-badge">检测中</span><span class="user-avatar">R</span></div></header>
      <div class="content" id="content"><div class="initial-loading"><span class="spinner"></span> 正在打开 PaperTrail...</div></div>
      <footer class="site-footer"><span>PaperTrail · v0.1 / 文献阅读 Agent MVP</span><span>每一条分析，都应回到证据本身。</span></footer>
    </main>
  </div>

  <div class="modal-layer hidden" id="evidenceModal" role="dialog" aria-modal="true" aria-label="原文证据">
    <div class="modal-shell">
      <div class="modal-head"><div><div class="overline">SOURCE VERIFICATION</div><h3>回到原文，核查证据</h3></div><button aria-label="关闭" class="icon-button" data-action="close-modal"><svg class="icon"><use href="#ico-x"/></svg></button></div>
      <div class="modal-main"><div class="pdf-viewport"><iframe title="论文 PDF 原文" id="pdfFrame"></iframe></div><div class="source-pane"><span class="mini-heading">当前引用</span><div class="source-meta" id="sourceMeta">PDF 第 1 页</div><blockquote id="sourceQuote"></blockquote><p class="source-footnote">点击左侧 PDF 阅读器中的对应页，核对引用是否出现，以及原文是否确实支持结论。</p><a class="btn secondary" id="openPdfTab" target="_blank" rel="noopener noreferrer">在新标签页打开 PDF ↗</a></div></div>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input type="file" id="uploadInput" accept="application/pdf,.pdf" hidden />
  <script src="/static/app.js" defer></script>
</body>
</html>
