services:
  - type: web
    name: papertrail-agent
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: OPENAI_MODEL
        value: gpt-4.1
      - key: OPENAI_API_KEY
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: DATA_DIR
        value: /var/data
      - key: ENABLE_OCR
        value: "false"
    disk:
      name: papertrail-data
      mountPath: /var/data
      sizeGB: 1
